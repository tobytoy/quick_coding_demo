syntax = "proto3";

package helloworld;

option go_package = "example.com/helloworld/gen;gen";

service Greeter {
  // 一個簡單的 RPC，輸入 HelloRequest 回傳 HelloReply
  rpc SayHello(HelloRequest) returns (HelloReply);
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}
